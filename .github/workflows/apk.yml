name: Gerar APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android assembleRelease --no-daemon
      - id: v
        run: |
          V=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          echo "n=$V" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk DESKtab-v$V.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.n }}
          name: DESKtab v${{ steps.v.outputs.n }}
          make_latest: true
          files: DESKtab-v${{ steps.v.outputs.n }}.apk
